<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招标商机管理系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
    background: #f0f2f5;
    color: #1f2329;
    padding: 24px;
  }
  .container { max-width: 1240px; margin: 0 auto; }

  /* 顶部 */
  .header {
    background: linear-gradient(135deg, #c8161e 0%, #e0454c 100%);
    color: #fff;
    border-radius: 12px;
    padding: 22px 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
  .header .sub { font-size: 13px; opacity: .92; margin-top: 6px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px; cursor: pointer;
    font-size: 14px; font-family: inherit; transition: all .15s;
  }
  .btn-add {
    background: #fff; color: #c8101e; font-weight: 600;
    padding: 10px 22px; font-size: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .btn-add:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.22); }
  .btn-ghost { background: #fff; color: #555; border: 1px solid #d9d9d9; }
  .btn-ghost:hover { border-color: #c8101e; color: #c8101e; }
  .btn-primary { background: #c8101e; color: #fff; }
  .btn-primary:hover { background: #a80d15; }
  .btn-warn { background: #fff; color: #c8101e; border: 1px solid #c8101e; }
  .btn-warn:hover { background: #fdf0f0; }
  .btn-sm { padding: 3px 10px; font-size: 12px; border-radius: 4px; }
  .btn-sm + .btn-sm { margin-left: 4px; }

  /* 统计卡片 */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-card {
    background: #fff; border-radius: 10px; padding: 14px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .stat-card .num { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .stat-card .lbl { font-size: 12px; color: #888; margin-top: 4px; }
  .stat-card.urgent { border: 2px solid #c8101e; }
  .stat-card.urgent .num { color: #c8101e; }

  /* 工具栏 */
  .toolbar {
    background: #fff; border-radius: 10px; padding: 12px 16px;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); margin-bottom: 16px;
  }
  .toolbar input, .toolbar select {
    padding: 7px 10px; border: 1px solid #d9d9d9; border-radius: 6px;
    font-size: 13px; font-family: inherit; outline: none; background: #fff;
  }
  .toolbar input:focus, .toolbar select:focus { border-color: #c8101e; }
  .toolbar .search { flex: 1; min-width: 180px; }

  /* 徽章 */
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .b-待跟进 { background: #fff7e6; color: #d48806; }
  .b-已报名 { background: #e6f4ff; color: #1677ff; }
  .b-已投标 { background: #f9f0ff; color: #722ed1; }
  .b-已中标 { background: #f6ffed; color: #389e0d; }
  .b-已落标 { background: #fff1f0; color: #cf1322; }
  .b-已放弃 { background: #fafafa; color: #8c8c8c; }

  /* 表格 */
  .table-wrap { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    background: #fafafa; text-align: left; padding: 11px 12px;
    font-weight: 600; color: #555; border-bottom: 2px solid #f0f0f0;
    white-space: nowrap; cursor: pointer; user-select: none;
  }
  thead th:hover { color: #c8101e; }
  tbody td { padding: 11px 12px; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
  tbody tr:hover { background: #fffafa; }
  tbody tr.row-alert { background: #fff1f0; }
  tbody tr.row-alert:hover { background: #ffe8e6; }
  tbody tr.row-expired td { color: #b0b0b0; }
  .deadline { font-weight: 600; white-space: nowrap; }
  .deadline.dl-alert { color: #cf1322; }
  .alert-tag {
    display: inline-block; background: #cf1322; color: #fff;
    font-size: 11px; border-radius: 3px; padding: 1px 6px;
    margin-left: 6px; font-weight: 600; vertical-align: 1px;
  }
  .alert-tag.off { background: #b0b0b0; }
  .proj-name { font-weight: 600; max-width: 280px; }
  .note-cell { max-width: 200px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { white-space: nowrap; }
  .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 14px; }
  .empty .icon { font-size: 42px; margin-bottom: 10px; }
  .count-hint { font-size: 12px; color: #999; margin-left: auto; }

  /* 弹窗 */
  .modal-mask {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 1000; align-items: center; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 12px; width: 660px; max-width: 94vw;
    max-height: 92vh; overflow-y: auto; padding: 24px 28px;
    box-shadow: 0 8px 30px rgba(0,0,0,.2);
  }
  .modal h2 { font-size: 18px; margin-bottom: 18px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
  .form-item { display: flex; flex-direction: column; }
  .form-item.full { grid-column: 1 / -1; }
  .form-item label { font-size: 13px; color: #555; margin-bottom: 5px; font-weight: 600; }
  .form-item label .req { color: #cf1322; }
  .form-item input, .form-item select, .form-item textarea {
    padding: 8px 10px; border: 1px solid #d9d9d9; border-radius: 6px;
    font-size: 13.5px; font-family: inherit; outline: none; background: #fff;
  }
  .form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: #c8101e; }
  .form-item textarea { resize: vertical; min-height: 56px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

  /* 详情 */
  .detail-list { font-size: 14px; }
  .detail-row { display: flex; padding: 9px 0; border-bottom: 1px solid #f5f5f5; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { width: 110px; color: #888; flex-shrink: 0; font-size: 13px; }
  .detail-row .v { flex: 1; word-break: break-all; }

  /* Toast */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: #333; color: #fff; padding: 10px 22px; border-radius: 8px;
    font-size: 13.5px; z-index: 2000; opacity: 0; transition: all .25s; pointer-events: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.25); white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 同步状态指示器 */
  .sync-indicator {
    font-size: 12px; padding: 3px 12px; border-radius: 14px;
    white-space: nowrap; transition: all .2s; cursor: default;
    background: #fff; color: #999; border: 1px solid #d9d9d9;
  }
  .sync-indicator.online { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
  .sync-indicator.syncing { background: #fff7e6; color: #d48806; border-color: #ffe58f; }
  .sync-indicator.offline { background: #fafafa; color: #8c8c8c; border-color: #e0e0e0; }

  @media (max-width: 900px) {
    .stats { grid-template-columns: repeat(3, 1fr); }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <h1>招标商机管理系统</h1>
      <div class="sub">待跟进 → 已报名 → 已投标 → 已中标 / 已落标 / 已放弃 · 截止前7天自动预警 · 数据云端实时同步</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="sync-indicator offline" id="syncIndicator" title="云端同步状态">离线</span>
      <button class="btn btn-add" onclick="openForm(null)">＋ 新增商机</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input class="search" id="searchBox" type="text" placeholder="搜索项目名称 / 采购方 / 信息来源 / 下一步动作…" oninput="renderTable()">
    <select id="statusFilter" onchange="renderTable()">
      <option value="">全部状态</option>
      <option value="待跟进">待跟进</option>
      <option value="已报名">已报名</option>
      <option value="已投标">已投标</option>
      <option value="已中标">已中标</option>
      <option value="已落标">已落标</option>
      <option value="已放弃">已放弃</option>
    </select>
    <select id="alertFilter" onchange="renderTable()">
      <option value="">全部商机</option>
      <option value="alert">仅看7天内预警</option>
    </select>
    <button class="btn btn-ghost" onclick="exportCSV()">导出CSV</button>
    <span class="count-hint" id="countHint"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="name">项目名称</th>
          <th data-key="buyer">采购方</th>
          <th data-key="budget">预算金额(万)</th>
          <th data-key="deadline">报名截止时间</th>
          <th data-key="source">信息来源</th>
          <th data-key="status">跟进状态</th>
          <th data-key="nextAction">下一步动作</th>
          <th data-key="remark">备注</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyTip" style="display:none;">
      <div class="icon">📋</div>
      <div>暂无商机数据</div>
      <div style="font-size:12px;margin-top:6px;">点击右上角「新增商机」开始录入</div>
    </div>
  </div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal-mask" id="formModal">
  <div class="modal">
    <h2 id="modalTitle">新增商机</h2>
    <div class="form-grid">
      <div class="form-item full">
        <label>项目名称 <span class="req">*</span></label>
        <input id="fName" type="text" placeholder="如：南方电网2027年度仓储物流服务项目" maxlength="200">
      </div>
      <div class="form-item full">
        <label>采购方 <span class="req">*</span></label>
        <input id="fBuyer" type="text" placeholder="如：南方电网供应链集团" maxlength="100">
      </div>
      <div class="form-item">
        <label>预算金额（万元）</label>
        <input id="fBudget" type="number" min="0" step="0.01" placeholder="如：500">
      </div>
      <div class="form-item">
        <label>报名截止时间 <span class="req">*</span></label>
        <input id="fDeadline" type="date">
      </div>
      <div class="form-item full">
        <label>信息来源</label>
        <input id="fSource" type="text" placeholder="如：中国招标投标公共服务平台 / 国网ECP / 烟草平台…" maxlength="100">
      </div>
      <div class="form-item">
        <label>跟进状态</label>
        <select id="fStatus">
          <option value="待跟进">待跟进</option>
          <option value="已报名">已报名</option>
          <option value="已投标">已投标</option>
          <option value="已中标">已中标</option>
          <option value="已落标">已落标</option>
          <option value="已放弃">已放弃</option>
        </select>
      </div>
      <div class="form-item">
        <label>下一步动作</label>
        <input id="fNext" type="text" placeholder="如：准备报名资料 / 制作投标文件" maxlength="200">
      </div>
      <div class="form-item full">
        <label>备注</label>
        <textarea id="fRemark" placeholder="联系人、资格要求、注意事项等" maxlength="500"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeForm()">取消</button>
      <button class="btn btn-primary" onclick="saveForm()">保存</button>
    </div>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-mask" id="detailModal">
  <div class="modal">
    <h2>商机详情</h2>
    <div class="detail-list" id="detailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeDetail()">关闭</button>
      <button class="btn btn-warn" onclick="editFromDetail()">编辑</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= 常量与状态 ================= */
var STORE_KEY = 'bid_opp_mgr_v1';
var STATUSES = ['待跟进', '已报名', '已投标', '已中标', '已落标', '已放弃'];
var ACTIVE_STATUSES = ['待跟进', '已报名', '已投标'];

/* ===== Supabase 云同步配置 ===== */
var SUPABASE_URL = 'https://bownwbjnmxcknsvdpvaw.supabase.co';
var SUPABASE_KEY = 'sb_publishable_4cBVk8neyK8T7LSoI4FZNA_upd2toP0';
var SUPABASE_TABLE = 'opportunities';
var SYNC_USER = 'public';
var POLL_INTERVAL = 30000; // 30秒轮询

var opportunities = loadData();
var editingId = null;   // 编辑中的记录 id，null 表示新增
var detailId = null;    // 详情中的记录 id
var sortKey = null;
var sortDir = 1;

// 云同步状态
var cloudOnline = false;
var syncing = false;
var pushTimer = null;
var pollTimer = null;

/* ================= 数据持久化 ================= */
function loadData() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveData() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(opportunities)); } catch (e) {}
  // 防抖推送云端（500ms 合并多次操作）
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(function () { pushToCloud(); }, 500);
}

/* ===== 云同步函数 ===== */
function cloudRequest(path, options) {
  options = options || {};
  return fetch(SUPABASE_URL + '/rest/v1/' + path, {
    method: options.method || 'GET',
    headers: Object.assign({
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    }, options.headers || {}),
    body: options.body
  }).then(function (res) {
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res;
  });
}

function pullFromCloud() {
  return cloudRequest(SUPABASE_TABLE + '?user_id=eq.' + SYNC_USER + '&order=updated_at.desc')
    .then(function (res) { return res.json(); })
    .then(function (cloudRows) {
      if (!Array.isArray(cloudRows)) return false;
      var cloudItems = cloudRows.map(function (r) {
        return {
          id: r.id, name: r.name, buyer: r.buyer, budget: r.budget,
          deadline: r.deadline, source: r.source, status: r.status,
          nextAction: r.nextAction, remark: r.remark,
          updated_at: r.updated_at || 0
        };
      });
      if (cloudItems.length > 0) {
        // 合并：按 id 去重，updated_at 大的优先
        var map = {};
        opportunities.forEach(function (o) { map[o.id] = o; });
        cloudItems.forEach(function (c) {
          var ex = map[c.id];
          if (!ex || (c.updated_at || 0) >= (ex.updated_at || 0)) map[c.id] = c;
        });
        opportunities = Object.keys(map).map(function (k) { return map[k]; });
        try { localStorage.setItem(STORE_KEY, JSON.stringify(opportunities)); } catch (e) {}
      } else {
        // 云端为空，本地有数据 → 推送
        try {
          var raw = localStorage.getItem(STORE_KEY);
          if (raw && JSON.parse(raw).length > 0) return pushToCloud();
        } catch (e) {}
      }
      cloudOnline = true;
      updateSyncIndicator();
      return true;
    })
    .catch(function () {
      cloudOnline = false;
      updateSyncIndicator();
      return false;
    });
}

function pushToCloud() {
  return cloudRequest(SUPABASE_TABLE + '?select=id&user_id=eq.' + SYNC_USER)
    .then(function (res) { return res.json(); })
    .then(function (cloudIds) {
      var localIds = opportunities.map(function (o) { return o.id; });
      var toDelete = cloudIds.filter(function (c) { return localIds.indexOf(c.id) === -1; });
      var dels = [];
      if (toDelete.length > 0) {
        var idList = toDelete.map(function (x) { return x.id; }).join(',');
        dels.push(cloudRequest(SUPABASE_TABLE + '?id=in.(' + idList + ')', { method: 'DELETE' }));
      }
      if (opportunities.length > 0) {
        var now = Date.now();
        var payload = opportunities.map(function (o) {
          return {
            id: o.id, name: o.name, buyer: o.buyer,
            budget: o.budget == null ? null : Number(o.budget),
            deadline: o.deadline || '', source: o.source || '',
            status: o.status, nextAction: o.nextAction || '',
            remark: o.remark || '', updated_at: o.updated_at || now,
            user_id: SYNC_USER
          };
        });
        dels.push(cloudRequest(SUPABASE_TABLE, {
          method: 'POST',
          headers: { Prefer: 'resolution=merge-duplicates' },
          body: JSON.stringify(payload)
        }));
      }
      return Promise.all(dels).then(function () {
        cloudOnline = true;
        updateSyncIndicator();
        return true;
      });
    })
    .catch(function () {
      cloudOnline = false;
      updateSyncIndicator();
      return false;
    });
}

function updateSyncIndicator() {
  var el = document.getElementById('syncIndicator');
  if (!el) return;
  if (syncing) {
    el.textContent = '同步中…';
    el.className = 'sync-indicator syncing';
  } else if (cloudOnline) {
    el.textContent = '已同步';
    el.className = 'sync-indicator online';
  } else {
    el.textContent = '离线';
    el.className = 'sync-indicator offline';
  }
}

/* ================= 工具函数 ================= */
function genId() { return Date.now() + '_' + Math.floor(Math.random() * 100000); }

function parseDate(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if (!m) return null;
  return new Date(+m[1], +m[2] - 1, +m[3]);
}
function fmtDate(s) {
  if (!s) return '—';
  var d = parseDate(s);
  return d ? s : s;
}
function daysUntil(dateStr) {
  var d = parseDate(dateStr);
  if (!d) return null;
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((d - today) / 86400000);
}
function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(t._timer);
  t._timer = setTimeout(function () { t.className = 'toast'; }, 2200);
}

/* ================= 预警逻辑 ================= */
function isActiveStatus(s) { return ACTIVE_STATUSES.indexOf(s) >= 0; }

/*
 * 预警级别（仅对进行中状态生效，终局状态不预警）：
 *  -1 = 不预警（已中标/已落标/已放弃）
 *   0 = 正常（剩余超过7天）
 *   1 = 7天内预警
 *   2 = 已过期
 */
function alertLevel(item) {
  if (!isActiveStatus(item.status)) return -1;
  var d = daysUntil(item.deadline);
  if (d == null) return 0;
  if (d < 0) return 2;
  if (d <= 7) return 1;
  return 0;
}

/* ================= 渲染 ================= */
function renderStats() {
  var total = opportunities.length;
  var active = opportunities.filter(function (o) { return isActiveStatus(o.status); }).length;
  var urgent = opportunities.filter(function (o) { return alertLevel(o) === 1; }).length;
  var won = opportunities.filter(function (o) { return o.status === '已中标'; }).length;
  var lost = opportunities.filter(function (o) { return o.status === '已落标' || o.status === '已放弃'; }).length;

  var cards = [
    ['全部商机', total, false],
    ['跟进中', active, false],
    ['7天内预警', urgent, urgent > 0],
    ['已中标', won, false],
    ['已落标/放弃', lost, false]
  ];
  document.getElementById('stats').innerHTML = cards.map(function (c) {
    return '<div class="stat-card' + (c[2] ? ' urgent' : '') + '">' +
      '<div class="num">' + c[1] + '</div><div class="lbl">' + c[0] + '</div></div>';
  }).join('');
}

function getFiltered() {
  var kw = document.getElementById('searchBox').value.trim().toLowerCase();
  var st = document.getElementById('statusFilter').value;
  var af = document.getElementById('alertFilter').value;
  return opportunities.filter(function (o) {
    if (st && o.status !== st) return false;
    if (af === 'urgent' && alertLevel(o) !== 1) return false;
    if (kw) {
      var hay = [o.name, o.buyer, o.source, o.nextAction, o.remark].join(' ').toLowerCase();
      if (hay.indexOf(kw) < 0) return false;
    }
    return true;
  });
}

function renderTable() {
  var list = getFiltered();

  if (sortKey) {
    list.sort(function (a, b) {
      var va = a[sortKey] == null ? '' : a[sortKey];
      var vb = b[sortKey] == null ? '' : b[sortKey];
      if (sortKey === 'budget') { va = Number(va) || 0; vb = Number(vb) || 0; }
      else { va = String(va); vb = String(vb); }
      if (va < vb) return -1 * sortDir;
      if (va > vb) return 1 * sortDir;
      return 0;
    });
  }

  var tbody = document.getElementById('tbody');
  var empty = document.getElementById('emptyTip');
  document.getElementById('countHint').textContent =
    opportunities.length ? '共 ' + list.length + ' / ' + opportunities.length + ' 条' : '';

  if (!list.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  tbody.innerHTML = list.map(function (o) {
    var lv = alertLevel(o);
    var rowCls = lv === 2 ? 'row-expired' : (lv === 1 ? 'row-alert' : '');

    var dlHtml = '—';
    if (o.deadline) {
      var dlCls = lv === 1 ? 'dl-alert' : '';
      dlHtml = '<span class="deadline ' + dlCls + '">' + escHtml(o.deadline) + '</span>';
      if (lv === 1) dlHtml += '<span class="alert-tag">剩' + daysUntil(o.deadline) + '天</span>';
      else if (lv === 2) dlHtml += '<span class="alert-tag off-gray">已过期</span>';
    }

    return '<tr class="' + rowCls + '">' +
      '<td class="proj-name" title="' + escHtml(o.name) + '">' + escHtml(o.name) + '</td>' +
      '<td title="' + escHtml(o.buyer) + '">' + escHtml(o.buyer) + '</td>' +
      '<td>' + (o.budget != null && o.budget !== '' ? Number(o.budget).toLocaleString('zh-CN', { maximumFractionDigits: 2 }) : '—') + '</td>' +
      '<td>' + dlHtml + '</td>' +
      '<td title="' + escHtml(o.source) + '">' + escHtml(o.source || '—') + '</td>' +
      '<td><span class="badge b-' + o.status + '">' + o.status + '</span></td>' +
      '<td title="' + escHtml(o.nextAction) + '">' + escHtml(o.nextAction || '—') + '</td>' +
      '<td class="note-cell" title="' + escHtml(o.remark) + '">' + escHtml(o.remark || '—') + '</td>' +
      '<td class="actions">' +
        '<button class="btn btn-sm btn-ghost" onclick="viewDetail(\'' + o.id + '\')">查看</button>' +
        '<button class="btn btn-sm btn-warn" onclick="openForm(\'' + o.id + '\')">编辑</button>' +
        '<button class="btn btn-sm btn-ghost" onclick="confirmDelete(\'' + o.id + '\')">删除</button>' +
      '</td></tr>';
  }).join('');
}

function renderAll() { renderStats(); renderTable(); }

/* ================= 表单（新增/编辑） ================= */
function findById(id) {
  for (var i = 0; i < opportunities.length; i++) {
    if (String(opportunities[i].id) === String(id)) return opportunities[i];
  }
  return null;
}

function openForm(id) {
  var o = id ? findById(id) : null;
  editingId = id || null;
  document.getElementById('modalTitle').textContent = o ? '编辑商机' : '新增商机';

  document.getElementById('fName').value = o ? o.name : '';
  document.getElementById('fBuyer').value = o ? o.buyer : '';
  document.getElementById('fBudget').value = (o && o.budget != null) ? o.budget : '';
  document.getElementById('fDeadline').value = o ? o.deadline : '';
  document.getElementById('fSource').value = o ? o.source : '';
  document.getElementById('fStatus').value = o ? o.status : '待跟进';
  document.getElementById('fNext').value = o ? o.nextAction : '';
  document.getElementById('fRemark').value = o ? o.remark : '';

  document.getElementById('formModal').classList.add('show');
  document.getElementById('fName').focus();
}

function closeForm() {
  document.getElementById('formModal').classList.remove('show');
  editingId = null;
}

function saveForm() {
  var name = document.getElementById('fName').value.trim();
  var buyer = document.getElementById('fBuyer').value.trim();
  var budgetRaw = document.getElementById('fBudget').value.trim();
  var deadline = document.getElementById('fDeadline').value;
  var source = document.getElementById('fSource').value.trim();
  var status = document.getElementById('fStatus').value;
  var nextAction = document.getElementById('fNext').value.trim();
  var remark = document.getElementById('fRemark').value.trim();

  if (!name) { toast('请填写项目名称'); return; }
  if (!buyer) { toast('请填写采购方'); return; }
  if (!deadline) { toast('请选择报名截止时间'); return; }
  if (budgetRaw && isNaN(Number(budgetRaw))) { toast('预算金额需为数字'); return; }

  var rec = {
    id: editingId ? String(editingId) : todayId(),
    name: name,
    buyer: buyer,
    budget: budgetRaw === '' ? null : Number(budgetRaw),
    deadline: deadline,
    source: source,
    status: status,
    nextAction: nextAction,
    remark: remark,
    updatedAt: new Date().toISOString(),
    updated_at: Date.now()
  };

  var existed = findById(rec.id);
  if (existed) {
    var idx = opportunities.indexOf(existed);
    opportunities[idx] = rec;
  } else {
    opportunities.push(rec);
  }
  saveData();
  closeForm();
  renderAll();
  toast(existed ? '商机已更新' : '商机已新增');
}

function todayId() { return 'id' + Date.now() + '_' + Math.floor(Math.random() * 9999); }

/* ================= 详情 ================= */
function viewDetail(id) {
  var o = findById(id);
  if (!o) return;
  detailId = id;

  var lv = alertLevel(o);
  var dlText = o.deadline ? escHtml(o.deadline) : '—';
  if (lv === 1) dlText += '  <span class="alert-tag">剩' + daysUntil(o.deadline) + '天</span>';
  else if (lv === 2) dlText += '  <span class="alert-tag off-gray">已过期</span>';

  var rows = [
    ['项目名称', o.name],
    ['采购方', o.buyer],
    ['预算金额', o.budget != null && o.budget !== '' ? Number(o.budget).toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + ' 万元' : '—'],
    ['报名截止时间', dlText],
    ['信息来源', o.source || '—'],
    ['跟进状态', '<span class="badge b-' + o.status + '">' + o.status + '</span>'],
    ['下一步动作', o.nextAction || '—'],
    ['备注', o.remark || '—']
  ];
  document.getElementById('detailBody').innerHTML = rows.map(function (r) {
    return '<div class="detail-row"><div class="k">' + r[0] + '</div><div class="v">' + r[1] + '</div></div>';
  }).join('');
  document.getElementById('detailModal').classList.add('show');
}

function closeDetail() { document.getElementById('detailModal').classList.remove('show'); detailId = null; }

function editFromDetail() {
  var id = detailId;
  closeDetail();
  if (id) openForm(id);
}

/* ================= 删除 ================= */
function confirmDelete(id) {
  var o = findById(id);
  if (!o) return;
  if (confirm('确定删除商机「' + o.name + '」？删除后不可恢复。')) {
    opportunities = opportunities.filter(function (x) { return String(x.id) !== String(id); });
    saveData();
    renderAll();
    toast('已删除');
  }
}

/* ================= 排序 ================= */
document.querySelectorAll('th[data-key]').forEach(function (th) {
  th.addEventListener('click', function () {
    var k = th.getAttribute('data-key');
    if (sortKey === k) sortDir = -sortDir;
    else { sortKey = k; sortDir = 1; }
    renderTable();
  });
});

/* ================= 导出CSV ================= */
function exportCSV() {
  var csv = '\uFEFF' + [
    ['项目名称', '采购方', '预算金额(万元)', '报名截止时间', '信息来源', '跟进状态', '下一步动作', '备注'],
    getFiltered().map(function (o) {
      return [o.name, o.buyer, o.budget != null ? o.budget : '', o.deadline || '', o.source || '', o.status, o.nextAction || '', o.remark || ''];
    })
  ].map(function (row) {
    return row.map(function (c) {
      c = String(c == null ? '' : c);
      return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
    }).join(',');
  }).join('\n');

  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = '招标商机导出_' + todayId().slice(2, 12).replace(/[^0-9]/g, '').slice(0, 8) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('已导出CSV，可用Excel打开');
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* ================= 初始示例数据 ================= */
function seedIfEmpty() {
  if (opportunities.length) return;
  var d = new Date();
  function ds(offset) {
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate() + offset);
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }
  opportunities = [
    { id: 'demo1', name: '示例：南方电网仓储物流服务框架项目', buyer: '南方电网供应链集团', budget: 1500, deadline: ds(4), source: '中国招标投标公共服务平台', status: '已报名', nextAction: '准备投标文件（技术方案）', remark: '示例数据，可编辑或删除', updatedAt: new Date().toISOString() },
    { id: 'demo2', name: '示例：烟草配送运输服务项目', buyer: '中国烟草某省公司', budget: 380, deadline: ds(9), source: '烟草电子采购平台', status: '待跟进', nextAction: '联系客户确认资格要求', remark: '示例数据，可编辑或删除', updatedAt: new Date().toISOString() },
    { id: 'demo3', name: '示例：铁塔应急物资配送项目', buyer: '铁塔能源公司', budget: 220, deadline: ds(-3), source: '铁塔商务平台', status: '已投标', nextAction: '跟进评标结果', remark: '示例数据，可编辑或删除', updatedAt: new Date().toISOString() }
  ];
  saveData();
  toast('已预置3条示例商机，可编辑或删除后录入您自己的数据');
}

/* ================= 初始化 ================= */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeForm(); closeDetail(); }
});
document.querySelectorAll('.modal-mask').forEach(function (mask) {
  mask.addEventListener('click', function (e) {
    if (e.target === mask) mask.classList.remove('show');
  });
});

seedIfEmpty();
renderAll();

/* ================= 云同步启动 ================= */
syncing = true;
updateSyncIndicator();
pullFromCloud().then(function () {
  syncing = false;
  updateSyncIndicator();
  renderAll();
});
// 定时轮询云端（每 30 秒拉取其他设备的更新）
pollTimer = setInterval(function () {
  var before = JSON.stringify(opportunities);
  pullFromCloud().then(function (ok) {
    if (ok && JSON.stringify(opportunities) !== before) renderAll();
    updateSyncIndicator();
  });
}, POLL_INTERVAL);
</script>
